[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeslides"
version = "0.1.0"
description = "Teach programming through live, reactive code slides."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.7",
]

[project.scripts]
codeslides = "codeslides.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codeslides"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
